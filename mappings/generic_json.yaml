source: generic_json
format: json
description: "Generic JSON log source fallback"

ocsf:
  version: "1.3.0"
  class_uid: 4001
  category_uid: 4

priority: 0

constants:
  metadata.product.vendor_name: "Generic"
  metadata.product.name: "JSON Log Source"
  connection_info.direction_id: 0

time:
  field: timestamp
  formats:
    - "%Y-%m-%dT%H:%M:%SZ"
    - "%Y-%m-%dT%H:%M:%S"
  timezone: "UTC"

field_map:
  src_ip:            { to: src_endpoint.ip,               type: ip }
  src_endpoint.ip:   { to: src_endpoint.ip,               type: ip }
  src_port:          { to: src_endpoint.port,             type: port }
  src_endpoint.port: { to: src_endpoint.port,             type: port }
  dst_ip:            { to: dst_endpoint.ip,               type: ip }
  dst_endpoint.ip:   { to: dst_endpoint.ip,               type: ip }
  dst_port:          { to: dst_endpoint.port,             type: port }
  dst_endpoint.port: { to: dst_endpoint.port,             type: port }
  protocol:          { to: connection_info.protocol_name, type: str }

  action:
    to: activity_id
    type: enum
    values: { allow: 1, deny: 5, reset: 3 }
    default: 99

  severity:
    to: severity_id
    type: enum
    values: { info: 1, low: 2, medium: 4, high: 5, critical: 6 }
    default: 1

defaults:
  activity_id: 6
  severity_id: 1
