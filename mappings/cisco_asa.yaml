source: cisco_asa
format: syslog
description: "Cisco ASA firewall via syslog"

ocsf:
  version: "1.9.0"
  class_uid: 4001
  category_uid: 4

priority: 100
mapping_version: "1.0.0"
match:
  all:
    - field: tag
      regex: "^%ASA-"

extract:
  - regex: "(?:for|from)\\s+(?P<src_if>\\w+):(?P<src>[\\d.]+)/(?P<spt>\\d+)(?:\\s*\\([\\d./]+\\))?\\s+to\\s+(?P<dst_if>\\w+):(?P<dst>[\\d.]+)/(?P<dpt>\\d+)"
  - regex: "Deny\\s+(?P<proto>\\w+)\\s+src\\s+(?P<src_if>\\w+):(?P<src>[\\d.]+)/(?P<spt>\\d+)\\s+dst\\s+(?P<dst_if>\\w+):(?P<dst>[\\d.]+)/(?P<dpt>\\d+)"

constants:
  metadata.product.vendor_name: "Cisco"
  metadata.product.name: "ASA"
  connection_info.direction_id: 0

time:
  field: timestamp
  formats:
    - "%b %d %Y %H:%M:%S"
    - "%b %d %H:%M:%S"
  assume_year: current
  timezone: "UTC"

field_map:
  src: { to: src_endpoint.ip, type: ip }
  spt: { to: src_endpoint.port, type: port }
  dst: { to: dst_endpoint.ip, type: ip }
  dpt: { to: dst_endpoint.port, type: port }
  proto: { to: connection_info.protocol_name, type: str }
  ifname: { to: src_endpoint.interface_name, type: str }
  tag: { to: metadata.event_code, type: str }

  action:
    to: activity_id
    type: enum
    values: { Built: 1, Teardown: 2, Reset: 3, Deny: 5, Denied: 5 }
    default: 99

  severity:
    to: severity_id
    type: enum
    values: { "0": 6, "1": 6, "2": 5, "3": 4, "4": 3, "5": 2, "6": 1, "7": 1 }
    default: 1

defaults:
  activity_id: 6
  severity_id: 1
