<!doctype html><html><head><meta charset="utf-8"><title>ULPF Evidence</title><style>body{font-family:system-ui;background:#111;color:#eee}pre{white-space:pre-wrap}</style></head><body><h1>ULPF Evidence</h1><div id="metrics"></div><ul id="events"></ul><script>
async function refresh(){const m=await fetch('/metrics').then(r=>r.json());document.getElementById('metrics').textContent=JSON.stringify(m);const e=await fetch('/events?limit=50').then(r=>r.json());const list=document.getElementById('events');list.replaceChildren();for(const item of e){const li=document.createElement('li');li.textContent=(item.metadata||{}).uid+' class '+item.class_uid;list.appendChild(li)}}
setInterval(refresh,1000);refresh();
</script></body></html>
